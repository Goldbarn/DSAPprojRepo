[project]
name = "wmark"
version = "0.1.0"
description = "Keyed word-based text watermarking: detector, evaluation, and attacks"
requires-python = ">=3.13"
dependencies = []

[project.scripts]
wm = "wmark.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wmark"]

[tool.ruff]
line-length = 120

[dependency-groups]
report = [
    "matplotlib>=3.11.2",
]
