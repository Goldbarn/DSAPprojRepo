# Post-evaluation design (v3): same thresholds as v2, with key-aware sentence rewriting instead of the synonym list.
# Reported separately from the first evaluation and the v2 run. The max_seconds limit applies per passage.

[detector]
threshold = 0.56         # 100 or more words
short_threshold = 0.68   # under short_below words, where scores vary more
short_below = 100

[watermark]
target = 0.57
max_seconds = 900        # 15 minutes per passage
max_substitutions = 0    # 0 = no cap

[experiment]
frozen = true
seed = 2026
